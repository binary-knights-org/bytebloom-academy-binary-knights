name: Verify

on:
    push:
        branches:
        - main
        - develop
    pull_request:
        branches:
        - main
        - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup java 21
        uses: actions/setup-java@v4

        with:
              distribution: temurin
              java-version: '21'
              cache: gradle
      - name: Build and Test
        run: ./gradlew build
  detekt:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Detekt
        run: ./gradlew detekt